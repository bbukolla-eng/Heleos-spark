[package]
name = "heleos-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[[bin]]
name = "heleos"
path = "src/main.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
age.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
heleos-core = { path = "../heleos-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
heleos-pdf-protocol = { path = "../heleos-pdf-protocol", features = ["artifact-host"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
