[package]
name = "heleos-worker-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "heleos-worker-runner"
path = "src/main.rs"

[[test]]
name = "runner"
path = "tests/runner.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[dependencies]
heleos-worker-protocol = { path = "../heleos-worker-protocol" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
