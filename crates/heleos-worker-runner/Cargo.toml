[package]
name = "heleos-worker-runner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "heleos-worker-runner"
path = "src/main.rs"

[[test]]
name = "runner"
path = "tests/runner.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "platform"
path = "tests/platform.rs"

[[test]]
name = "windows_containment"
path = "tests/windows_containment.rs"

[[bin]]
name = "heleos-worker-runner-test-provider"
path = "tests/support/windows_provider.rs"

[dependencies]
heleos-worker-protocol = { path = "../heleos-worker-protocol" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
heleos-worker-windows = { path = "../heleos-worker-windows" }
cap-primitives.workspace = true
windows-sys.workspace = true
