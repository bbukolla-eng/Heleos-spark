[workspace]
resolver = "3"
members = [
    "crates/heleos-worker-protocol",
    "crates/heleos-worker-runner",
    "crates/heleos-worker-windows",
]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
cap-primitives = { version = "=4.0.3", default-features = false }
clap = { version = "=4.6.6", features = ["derive"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
