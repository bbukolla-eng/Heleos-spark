[workspace]
resolver = "3"
members = ["crates/heleos-core"]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
fs2 = "=0.4.3"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "functions"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tempfile = "=3.27.0"
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
stellar-agent-windows-identity = "=0.1.0-alpha.6"
windows-acl = "=0.3.0"
windows-permissions = "=0.2.4"
