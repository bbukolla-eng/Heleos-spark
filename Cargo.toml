[workspace]
resolver = "3"
members = [
    "crates/heleos-cli",
    "crates/heleos-core",
    "crates/heleos-pdf-guest",
    "crates/heleos-pdf-protocol",
    "crates/heleos-platform-fs",
    "crates/heleos-test-fixtures",
    "crates/heleos-worker-protocol",
    "crates/heleos-worker-runner",
    "tests/verification",
]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
age = "=0.12.1"
bytes = "=1.12.1"
cap-fs-ext = { version = "=4.0.3", default-features = false, features = ["std"] }
cap-primitives = { version = "=4.0.3", default-features = false }
cap-std = { version = "=4.0.3", default-features = false }
clap = { version = "=4.6.6", features = ["derive"] }
ed25519-dalek = "=3.0.0"
fs2 = "=0.4.3"
libc = "=0.2.189"
lopdf = { version = "=0.44.0", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "functions"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_jcs = "=0.2.0"
sha2 = "=0.11.0"
thiserror = "=2.0.20"
tempfile = "=3.27.0"
tokio = { version = "=1.51.1", features = ["rt-multi-thread", "sync", "time"] }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "serde", "std"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
wasmparser = { version = "=0.254.0", default-features = false }
wasmtime = { version = "=48.0.1", default-features = false, features = ["async", "call-hook", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=48.0.1", default-features = false, features = ["p1"] }
wat = { version = "=1.254.0", default-features = false }
stellar-agent-windows-identity = "=0.1.0-alpha.6"
windows-acl = "=0.3.0"
windows-permissions = "=0.2.4"
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
