name: auto-merge
# The old label-triggered squash path is retired. Guarded delivery owns enabling
# merge commits only after its current-head policy and native protections pass.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use Guarded delivery; legacy direct merge enablement is disabled.'
