name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Unit tests (standard library only, no network)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Workflow scripts parse
        run: |
          for f in .claude/workflows/*.js docs/runs/*/scripts/*.js; do node --check "$f"; done
      - name: Repository checks (registry hashes, JSON, links, prose rule)
        run: python tools/ci/checks.py
