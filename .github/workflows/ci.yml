name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and Build Fabric dependencies
        run: python -m pip install --upgrade pip "setuptools>=68" && python -m pip install ".[build-fabric]"
      - name: Run complete unit suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
