name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests (standard library only, no network)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Workflow scripts parse
        run: |
          for f in .claude/workflows/*.js docs/runs/*/scripts/*.js; do node --check "$f"; done
      - name: Repository checks (registry hashes, JSON, links, prose rule)
        run: python tools/ci/checks.py
