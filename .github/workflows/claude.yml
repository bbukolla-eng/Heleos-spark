name: claude
# Answers @claude mentions in issues, pull requests, and review comments:
# it implements the request and commits: on an open pull request it pushes to that pull
# request's branch; from an issue it creates a branch and replies with a pre-filled pull
# request link a person must click. The action does not open pull requests itself
# (anthropics/claude-code-action v1.0.99, its docs/security.md, "Pull Request Creation").
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (docs/policies/github-automation.md).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; see docs/policies/github-automation.md"
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Bash(python -m unittest *),Bash(python3 -m unittest *),Bash(node --check *),Bash(python tools/ci/checks.py)"'
