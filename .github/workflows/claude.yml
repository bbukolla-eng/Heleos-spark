name: claude
# Answers @claude mentions in issues, pull requests, and review comments:
# it implements the request and commits: on an open pull request it pushes to that pull
# request's branch; from an issue it creates a branch and replies with a pre-filled pull
# request link a person must click. The action does not open pull requests itself
# (anthropics/claude-code-action v1.0.211, its docs/security.md, "Pull Request Creation").
#
# This job makes an external submission of INTERNAL repository content to Anthropic, so it
# is governed by docs/policies/egress.md and the decision record named in EGRESS_DECISION.
# The egress check step runs BEFORE the provider step and fails the job when that policy or
# that decision record is missing from the checkout, so the record is a gate, not a log.
# Needs the ANTHROPIC_API_KEY secret; until it exists this job prints a notice and passes.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
env:
  EGRESS_DECISION: docs/decisions/2026-09-03-egress-policy.md
  EGRESS_RULE: egress-3-claude-mention
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # Secret access is gated on this environment. The owner configures required reviewers on
    # it in Settings, Environments, so a pull request cannot reach ANTHROPIC_API_KEY on its
    # own first run. See docs/policies/egress.md section 6.
    environment: claude-egress
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY is not set; see docs/policies/github-automation.md"
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Egress precondition
        if: env.HAS_TOKEN == 'true'
        run: |
          # Snapshot the recorder before the action runs, so a run that edits or deletes
          # tools/egress/record.py cannot change or silence the record written afterwards.
          cp tools/egress/record.py "$RUNNER_TEMP/record.py"
          python3 "$RUNNER_TEMP/record.py" check \
            --provider anthropic \
            --purpose "Answer an @claude mention and commit the requested change on a branch" \
            --data-class INTERNAL --allowed-classes PUBLIC,INTERNAL \
            --decision "$EGRESS_DECISION" --rule "$EGRESS_RULE" \
            --root "$GITHUB_WORKSPACE" \
            --precall "$RUNNER_TEMP/precall.json"
      - if: env.HAS_TOKEN == 'true'
        id: claude
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # An @claude run implements a change, so it needs to run the suite to verify its own
          # work. That is a deliberate trade the review workflow does not make: this job is
          # triggered by a mention from someone with write access, not by an arbitrary pull
          # request head. docs/policies/egress.md section 6 records the residual risk.
          claude_args: '--allowed-tools "Bash(python -m unittest:*),Bash(python3 -m unittest:*),Bash(node --check:*),Bash(python tools/ci/checks.py:*)"'
      - name: Egress record
        # Only when the provider step actually ran, so a submission that happened is always
        # recorded and a call the gate blocked is not recorded as a refusal that never occurred.
        if: always() && env.HAS_TOKEN == 'true' && steps.claude.conclusion != '' && steps.claude.conclusion != 'skipped'
        run: |
          python3 "$RUNNER_TEMP/record.py" write \
            --provider anthropic \
            --purpose "Answer an @claude mention and commit the requested change on a branch" \
            --data-class INTERNAL --allowed-classes PUBLIC,INTERNAL \
            --decision "$EGRESS_DECISION" --rule "$EGRESS_RULE" \
            --root "$GITHUB_WORKSPACE" \
            --conclusion "${{ steps.claude.conclusion }}" \
            --session-id "${{ steps.claude.outputs.session_id }}" \
            --precall "$RUNNER_TEMP/precall.json" \
            --out egress.jsonl --summary "$GITHUB_STEP_SUMMARY"
      - name: Keep the egress record
        if: always() && hashFiles('egress.jsonl') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: egress-claude-${{ github.run_id }}-${{ github.run_attempt }}
          path: egress.jsonl
          retention-days: 90
