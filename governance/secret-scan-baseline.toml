# Adjudication evidence for the unsuppressed Gitleaks report, not scanner config.
# This file grants no Gitleaks ignore, path exclusion, regex exemption, or rule disable.
# Only the six metadata fields listed below were projected from the redacted report;
# no raw Match, Secret, or credential value is recorded here.

schema_version = 1
owner = "Heleos engineering"
foundation_scope = "Foundation 0.1"
expires_before = "Foundation 0.2"
revalidation = "The owner must re-adjudicate the complete unsuppressed history and current-tree reports before Foundation 0.2, or sooner on scanner, rule, scope, source-context, or baseline drift."
scanner = "gitleaks"
scanner_version = "8.30.1"
adjudicated_on = "2026-09-09"
expected_history_findings = 23
expected_current_tree_allowances = 1
redacted_history_report_sha256 = "86f92ab7d763065d88f7bf753805c7aa17beb8e0810c9b82ad17ddbf1e432426"
history_metadata_fields = ["Fingerprint", "Commit", "File", "RuleID", "StartLine", "EndLine"]
history_identity = "The complete tuple (fingerprint, commit, path, rule, start_line, end_line); fingerprint must equal commit:path:rule:start_line."
history_order = "Strict ascending fingerprint byte order; fingerprints and complete tuples must each be unique."
history_metadata_inheritance = "Each history entry inherits only owner, rationale, expiry, and revalidation from its exact adjudication record; class membership never authorizes another finding."
fail_closed = [
    "Reject an unknown schema, field, adjudication, scanner/version, missing field, wrong type, malformed identity, duplicate entry, count mismatch, expired scope, or absent release-scope evidence.",
    "Run complete unsuppressed full-history and current-tree scans before adjudication; reject failed, partial, absent, truncated, malformed, or unredacted reports. Do not give this file to Gitleaks as an ignore or baseline suppression input.",
    "Require one-to-one equality between all 23 history tuples and the complete history report. Reject every unmatched report finding and every unused history entry; do not auto-learn, refresh, or broaden this file.",
    "History commits are exact 40-character lowercase hexadecimal Git object IDs. Paths are exact relative slash-separated paths with no absolute prefix, dot components, traversal, backslash, normalization, case folding, glob, or regular-expression matching.",
    "History start_line and end_line are positive one-based integers with end_line >= start_line. Do not discard end_line, compare only a fingerprint, or transplant a history allowance onto a current-tree finding.",
    "Current-tree allowances require reading the exact UTF-8 regular source file from the scanned tree and checking the complete literal context below. Missing, ambiguous, unreadable, symbolic-link, changed, or out-of-range source evidence is a failure.",
    "Reject duplicate current-tree findings and every current-tree finding outside the single exact path/rule/context allowance. Receipt cwd_key values and historical API fixtures have no current-tree semantic allowance.",
    "Never read, copy, log, hash individually, or persist a finding's raw Match or Secret value during adjudication. Keep diagnostics to the approved metadata fields and aggregate counts.",
]

[adjudications.cwd_key_receipt]
owner = "Heleos engineering"
expected_history_findings = 20
rationale = "These exact content-addressed build_control receipts report cwd_key, a SHA-256 workspace locator represented by 64 lowercase hexadecimal characters. It is not an API credential. The adjudication covers only the 20 immutable tuples below, not the field name, hexadecimal shape, receipt directory, or generic-api-key rule generally."
expires_before = "Foundation 0.2"
revalidation = "Re-adjudicate on history identity or scanner/rule drift and before Foundation 0.2; never admit future receipts by shape alone."

[adjudications.invalid_idempotency_fixture]
owner = "Heleos engineering"
expected_history_findings = 1
rationale = "The exact historical tests/test_api.py finding is the Idempotency-Key invalid-input test fixture. Its test-only invalid input is not an authentication credential. Only the immutable tuple below is covered; current or future Idempotency-Key values are not exempt."
expires_before = "Foundation 0.2"
revalidation = "Re-adjudicate on history identity or scanner/rule drift and before Foundation 0.2; changes to this historical fixture require a new exact owner adjudication."

[adjudications.verifier_marker_literals]
owner = "Heleos engineering"
expected_history_findings = 1
rationale = "The exact historical verifier finding covers literal private-key marker strings in contains_secret's detection array, with no encoded key payload. The verifier searches for these marker strings to reject actual credential shapes. History uses only the immutable tuple; current-tree handling additionally requires the source semantics below."
expires_before = "Foundation 0.2"
revalidation = "Re-adjudicate on history identity, scanner/rule, or literal source-context drift and before Foundation 0.2."

[adjudications.windows_forbidden_path_fixture]
owner = "Heleos engineering"
expected_history_findings = 1
rationale = "The exact immutable worker-runner tuple is a Windows case-folding forbidden-path unit fixture. The allowed/SECRET and allowed/Secret/key paths assert OutOfScope for aliases of the forbidden allowed/secret path; they are not credentials. Only the single historical tuple below and its complete hashed test context are covered; no current-tree or future fixture allowance is granted."
expires_before = "Foundation 0.2"
revalidation = "Re-adjudicate on history identity, scanner/rule, or test source-context drift and before Foundation 0.2; never admit another path, line, commit, or matching shape by class membership."

[[current_tree]]
id = "verifier_marker_array"
owner = "Heleos engineering"
path = "tests/verification/src/bin/verify-provenance.rs"
rule = "private-key"
rationale = "Only literal marker lines inside the exact contains_secret detection array are non-secret source constants."
expires_before = "Foundation 0.2"
revalidation = "Open the scanned source and validate this complete context on every scan; the owner must re-adjudicate before Foundation 0.2 or after any context or scanner/rule drift."
maximum_findings = 1
normalization = "Decode strict UTF-8, split into source lines, and trim only ASCII spaces and tabs from each line; retain original one-based line indexes. Do not drop blank lines, decode escapes, strip comments, join source lines, or normalize other whitespace."
function_line = "fn contains_secret(bytes: &[u8]) -> bool {"
function_comment_line = '// Search actual credential shapes, not words such as "token" in source.'
text_binding_line = "let text = String::from_utf8_lossy(bytes);"
array_open_line = "for header in ["
array_close_line = "] {"
consumer_line = "for (offset, _) in text.match_indices(header) {"
marker_labels = ["PRIVATE KEY", "RSA PRIVATE KEY", "OPENSSH PRIVATE KEY", "EC PRIVATE KEY"]
marker_line_construction = 'For each label in order, concatenate one double quote, five hyphens, BEGIN followed by one ASCII space, the label, five hyphens, one double quote, and one comma. No additional source text is permitted on a marker line.'
marker_line_sha256 = [
    "ae2260d5177a9f774d9cb9b58ce86126b83761066874be8f0f32ffd70b334994",
    "8cdf81b353d06d0f314b29007526f752494c8333b730b2041476484cd84f70ec",
    "e3292a718093ce87b8ac392d30b3a25e457523a884cc8d3798a974af3d450875",
    "97fc69d836eba31713d6f5a9e15ad10208b6c853f71c6c0ffe11cd69430a23be",
]
context_line_count = 10
context_sha256 = "43e6624deca0ddd41800d3d752d89a28003840296da55de6b90c69190f69e387"
context_hash_encoding = "UTF-8 bytes of function_line, function_comment_line, text_binding_line, array_open_line, the four constructed marker lines, array_close_line, and consumer_line, in that order, each followed by exactly one LF."
source_requirement = "Require exactly one function_line and exactly one contiguous ten-line block equal to the constructed context in the scanned source. Recompute all four individual hashes without a trailing LF and the context hash with the specified LF encoding."
finding_requirement = "Require an empty current-tree Commit, the exact path and rule, and fingerprint path:rule:start_line. Require positive one-based start_line/end_line with end_line >= start_line, and require EVERY reported line in the inclusive range to be one of the four marker literals in that unique block. No fixed line number, line wildcard, other source occurrence, array delimiter, comment, consumer, or payload line is allowed."

