permissions = "The retained default-parent policy, parent marker, and parent capability are established before child mutation and rechecked at each named barrier without changing the shared parent. PendingSnapshotArtifact takes the created database, WAL, or SHM handle immediately after create-new and before every fallible injection, metadata, type, reparse, or length operation. Ownership transfer retains the original database/WAL/SHM FileMarker and private state; verify_recovered_files_are_private and recheck_all require the frozen markers and never adopt a recovered replacement. map_snapshot_binding_error maps only NotFound, NotADirectory, and Unix ELOOP or ENOTDIR at the named binding, permission-reopen, and post-remove absence contexts to PolicyDenied; InvalidInput, PermissionDenied, EACCES, and ordinary errors retain Io provenance. No public Store surface, fallback parent, ambient mutation, or ambient cleanup authority is added"
operation_register = "The exact test-frozen production register is SnapshotOpenOperation::ALL in source. CreationParentCapabilityClone, ProvisionalCleanupParentCapabilityClone, and ProvisionalCleanupParentHandleClone are the three separate pre-child operations and are not members of ALL. The finalized post-transfer additions occur once in order: IntoPartsTransfer, ProvisionalSecondBinding, OwnedParentHandleClone, OwnedParentCapabilityClone, ChildOpen, DatabasePostWritePrivacy, DatabasePostWriteMetadata, DatabasePostWriteMarker, DatabaseRelativeBinding, WalPostWritePrivacy, WalPostWriteMetadata, WalPostWriteMarker, WalRelativeBinding. The six capacity operations remain the separate SNAPSHOT_CAPACITY_OPERATIONS register. No test-only selector, fault, trace, counter, or operation register is public or enabled outside cfg(test)"
cleanup_and_close = "ReadSnapshotDirectory::close and best_effort_cleanup perform a retained validation, transfer proven pending marker/private evidence and drop the pending artifact handle, then perform the second recheck_retained_bindings_for_cleanup. The final marker and I/O checkpoint is inside that second validation before FinalRetainedCheckpoint. Checked close releases Windows handles in three synchronous phases: before database close with database and child handles retained; after database/artifact handles drop with child handles retained; after child handles drop. Store::close_read_only closes SQLite, runs checked scratch cleanup, releases source handles and the reader lock, and gives cleanup failure precedence over success or Database/Io primary outcomes. The retained-parent removal and its preceding validation are separate operations; there is no continuous same-principal ABA protection or never-delete-a-decoy claim across the excluded interval"
production_sites = "ReadOnlySnapshotParent::{retain_default,recheck}; ReadSnapshotDirectory::{create_impl,verify_recovered_files_are_private_impl,recheck_all,close,recheck_retained_bindings_for_cleanup,release_pending_artifact_for_cleanup,best_effort_cleanup}; map_snapshot_binding_error; SnapshotOpenOperation::ALL; SNAPSHOT_CAPACITY_OPERATIONS; Store::{open_read_only_with_snapshot_parent,close_read_only}"
